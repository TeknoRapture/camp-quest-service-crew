<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#173b2a" />
    <title>Camp Quest: Service Crew</title>
  </head>
  <body>
    <main id="game-shell">
      <header class="hud">
        <div class="brand"><span>☀</span><strong>Camp Quest</strong><small>Service Crew</small></div>
        <div class="meters">
          <div><span>ENERGY</span><div class="energy-track"><i id="energy-bar"></i></div></div>
          <b id="points">0 SP</b><small id="best">BEST 0</small>
        </div>
      </header>
      <section class="objective"><b>NOW:</b> <span id="objective">Talk to Coop</span></section>
      <div class="play-area">
        <canvas id="game" width="960" height="640" aria-label="Camp Quest game map"></canvas>
        <aside id="checklist" class="checklist">
          <button id="close-checklist" aria-label="Close checklist">×</button>
          <h2>Service Checklist</h2><p>DAY 1 · MAIN CAMP</p><ul id="tasks"></ul>
        </aside>
        <div id="dialogue" class="dialogue hidden"><b id="speaker"></b><p id="dialogue-text"></p><small>Tap ACTION to continue</small></div>
        <div id="toast" class="toast hidden"></div>
      </div>
      <section class="controls" aria-label="Touch controls">
        <div class="dpad">
          <button data-dir="up" aria-label="Move up">▲</button>
          <button data-dir="left" aria-label="Move left">◀</button>
          <button data-dir="down" aria-label="Move down">▼</button>
          <button data-dir="right" aria-label="Move right">▶</button>
        </div>
        <button id="checklist-button" class="round secondary">LIST</button>
        <button id="action-button" class="round action">ACTION<small>talk · grab · deliver</small></button>
      </section>
      <footer>Move with the D-pad or WASD / arrows · Action with Space or E</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
